name: Sign Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sign the committed 0.27.9 installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri signer sign releases/Frontier_0.27.9_x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-0.27.9-windows-signature
          path: releases/Frontier_0.27.9_x64-setup.exe.sig
          if-no-files-found: error
